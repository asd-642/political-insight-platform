      })();

      })();

            </div>
          </div>

        <section id="viewSources" class="view">
          <div class="section-heading wide">
            <div>
              <p class="eyebrow">Sources</p>
              <h1>來源架構</h1>
              <p class="section-note">
                本站把來源分成原始文件、財務數據、查核資料、官方說明與新聞脈絡。文章會優先引用可回查的公開資料，再用新聞報導補足事件背景，讓讀者知道每一篇整理大致依據哪些資料層級。
              </p>
            </div>
          </div>
          <div id="sourceList" class="source-list"></div>
        </section>
