<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("policyPulseTheme");
          const prefersLight = window.matchMedia?.("(prefers-color-scheme: light)").matches;
          document.documentElement.dataset.theme = saved || (prefersLight ? "light" : "dark");
        } catch {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <title>政策脈絡</title>
    <meta
      name="description"
      content="政策、人物、事件時間線與資料來源整理。"
    />
    <meta name="robots" content="index,follow" />
    <link rel="stylesheet" href="styles.css?v=20260520-7" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#top" aria-label="政策脈絡首頁">
        <span class="brand-mark">政</span>
        <span class="brand-text">政策脈絡</span>
      </a>

      <nav class="nav-tabs" aria-label="主要分頁">
        <button class="nav-tab is-active" data-view="overview" type="button">焦點</button>
        <button class="nav-tab" data-view="issues" type="button">議題</button>
        <button class="nav-tab" data-view="people" type="button">人物</button>
        <button class="nav-tab" data-view="timeline" type="button">時間線</button>
        <button class="nav-tab" data-view="sources" type="button">來源</button>
      </nav>

      <form id="siteSearchForm" class="search-field" role="search">
        <span aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path
              d="m21 21-4.35-4.35m1.35-5.15a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0Z"
            />
          </svg>
        </span>
        <input id="siteSearch" name="search" type="search" minlength="2" placeholder="搜尋政策、人物、事件" />
      </form>

      <div class="auth-controls" aria-label="帳號與顯示設定">
        <button id="themeToggle" class="utility-button" type="button">
          <span id="themeLabel">亮色</span>
        </button>
        <button id="accountButton" class="account-button" type="button" hidden>
          帳號
        </button>
      </div>
    </header>

    <main id="top" class="page-shell">
      <aside class="side-panel" aria-label="側邊工具">
        <section class="panel-section topic-panel">
          <button
            id="topicToggle"
            class="panel-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="topicFilters"
          >
            <span>
              <small>Topic</small>
              <strong>議題篩選</strong>
            </span>
            <span class="toggle-icon" aria-hidden="true">+</span>
          </button>
          <div id="topicFilters" class="filter-list" hidden></div>
        </section>

        <section class="panel-section">
          <div class="section-heading">
            <p class="eyebrow">Queue</p>
            <h2>追蹤清單</h2>
          </div>
          <div class="watch-list">
            <div class="watch-empty">
              <strong>正在讀取追蹤清單</strong>
              <span>文章頁按下追蹤後，這裡會顯示你的清單。</span>
            </div>
          </div>
        </section>

        <aside class="promo-slot promo-slot-side" data-promo-slot aria-label="廣告預留區">
          <span>廣告版位</span>
          <strong>300 x 250</strong>
        </aside>
      </aside>

      <section class="main-panel">
        <section class="promo-slot promo-slot-top" data-promo-slot aria-label="橫幅廣告預留區">
          <span>廣告版位</span>
          <strong>728 x 90</strong>
        </section>

        <section id="viewOverview" class="view is-active">
          <div class="news-board">
            <article id="featuredStory" class="featured-story"></article>
            <section class="headline-stack" aria-label="焦點標題">
              <div id="headlineList"></div>
            </section>
          </div>

          <div class="section-heading wide list-heading">
            <div>
              <p class="eyebrow">Latest Briefs</p>
              <h1>政策快訊</h1>
            </div>
            <span id="activeTopicLabel" class="topic-badge">全部</span>
          </div>
          <div id="articleGrid" class="article-grid"></div>
          <nav id="articlePagination" class="article-pagination" aria-label="文章分頁"></nav>

          <section class="promo-slot promo-slot-feed" data-promo-slot aria-label="文中廣告預留區">
            <span>廣告版位</span>
            <strong>In-feed / 336 x 280</strong>
          </section>
        </section>

        <section id="viewIssues" class="view">
          <div class="section-heading wide">
            <div>
              <p class="eyebrow">Issues</p>
              <h1>議題地圖</h1>
            </div>
          </div>
          <div id="issueMap" class="issue-map"></div>
        </section>

        <section id="viewPeople" class="view">
          <div class="section-heading wide">
            <div>
              <p class="eyebrow">People</p>
              <h1>人物資料</h1>
            </div>
          </div>
          <div id="peopleList" class="people-list"></div>
        </section>

        <section id="viewTimeline" class="view">
          <div class="section-heading wide">
            <div>
              <p class="eyebrow">Timeline</p>
              <h1 id="timelineTitle">事件時間線</h1>
            </div>
          </div>
          <div id="timelineList" class="timeline-list"></div>
        </section>

        <section id="viewSources" class="view">
          <div class="section-heading wide">
            <div>
              <p class="eyebrow">Sources</p>
              <h1>來源架構</h1>
            </div>
          </div>
          <div id="sourceList" class="source-list"></div>
        </section>
      </section>

      <aside class="detail-panel" aria-label="內容詳情">
        <div class="detail-sticky">
          <div class="section-heading">
            <p class="eyebrow">Selected</p>
            <h2 id="detailTitle">政策詳情</h2>
          </div>
          <div id="detailBody" class="detail-body"></div>
        </div>
      </aside>
    </main>

    <footer class="site-footer">
      <a href="about.html">關於本站</a>
      <a href="corrections.html">更正與來源政策</a>
      <a href="privacy.html">隱私權政策</a>
    </footer>

    <script src="firebase-config.js"></script>
    <script src="firebase-bootstrap.js?v=20260520-2"></script>
    <script src="site-seo.js?v=20260520-2"></script>
    <script src="auth-theme.js?v=20260520-1"></script>
    <script src="ad-safety.js?v=20260520-2"></script>
    <script src="visuals.js?v=20260520-2"></script>
    <script src="content/generated-content.js"></script>
    <script src="watchlist.js?v=20260520-4"></script>
    <script src="app.js?v=20260520-6"></script>
  </body>
</html>
