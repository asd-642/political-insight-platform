<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("policyPulseTheme");
          const prefersLight = window.matchMedia?.("(prefers-color-scheme: light)").matches;
          document.documentElement.dataset.theme = saved || (prefersLight ? "light" : "dark");
        } catch {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <title>忘記密碼｜政策脈絡</title>
    <meta name="robots" content="noindex,nofollow" />
    <link rel="stylesheet" href="styles.css?v=20260609-1" />
    <link rel="stylesheet" href="auth-ui-redesign.css?v=20260609-1" />
  </head>
  <body class="doc-page auth-page">
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="回到政策脈絡首頁">
        <span class="brand-mark">政</span>
        <span class="brand-text">政策脈絡</span>
      </a>
      <nav class="nav-tabs" aria-label="帳號導覽">
        <a class="nav-tab" href="index.html">首頁</a>
        <a class="nav-tab" href="register.html">註冊</a>
        <a class="nav-tab is-active" href="forgot-password.html">忘記密碼</a>
      </nav>
      <div class="auth-controls" aria-label="帳號與顯示設定">
        <button id="themeToggle" class="utility-button" type="button">
          <span id="themeLabel">亮色</span>
        </button>
        <button id="accountButton" class="account-button" type="button" hidden>帳號</button>
      </div>
    </header>

    <main class="auth-page-shell">
      <section class="auth-card auth-card-game auth-page-panel" data-auth-page="forgot">
        <div class="auth-site-title" aria-label="政策脈絡">
          <span class="auth-site-mark">政</span>
          <strong>政策脈絡</strong>
        </div>
        <div class="auth-page-copy">
          <p class="eyebrow">Password</p>
          <h1>重置密碼</h1>
          <p>輸入註冊信箱後，正式站會寄出重設連結；本機測試帳號會產生一組臨時密碼。</p>
        </div>

        <form class="auth-form auth-page-form">
          <label class="auth-field auth-field-plain">
            <span class="sr-only">電子信箱</span>
            <input name="email" type="email" autocomplete="email" placeholder="輸入註冊電子信箱" required />
          </label>
          <button class="auth-submit auth-submit-wide" type="submit">重置密碼</button>
          <p class="auth-message" data-auth-status role="status"></p>
        </form>
      </section>
    </main>

    <script src="firebase-config.js"></script>
    <script src="firebase-bootstrap.js?v=20260608-3"></script>
    <script src="auth-theme.js?v=20260609-1"></script>
    <script src="auth-pages.js?v=20260520-3"></script>
  </body>
</html>
